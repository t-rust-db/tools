[package]
name = "column-rs"
version = "0.20.4"
edition = "2021"

[lib]
name = "column_rs"
path = "src/lib.rs"

[[bin]]
name = "column-rs"
path = "src/bin/column-rs/main.rs"

[dependencies]
db-core = { version = ">=0.114.0", git = "https://github.com/t-rust-db/db-core", tag = "v0.114.0", default-features = false, features = ["parser-column", "vm-batch", "codegen-batch", "emit-batch", "storage-column"] }
db-cli = { git = "https://github.com/t-rust-db/db-cli", tag = "v0.5.0" }
itoa = "1"
ryu = "1"
