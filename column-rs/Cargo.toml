[package]
name = "column-rs"
version = "0.15.2"
edition = "2021"

[lib]
name = "column_rs"
path = "src/lib.rs"

[[bin]]
name = "column-rs"
path = "src/bin/column-rs/main.rs"

[dependencies]
db-storage = { git = "https://github.com/t-rust-db/db-storage", tag = "v0.2.0" }
db-core = { git = "https://github.com/t-rust-db/db-core", tag = "v0.12.0", default-features = false, features = ["parser-column", "vm-batch"] }
db-cli = { git = "https://github.com/t-rust-db/db-cli", tag = "v0.1.0" }
