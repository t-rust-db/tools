[package]
name = "column-rs"
version = "0.15.2"
edition = "2021"

[lib]
name = "column_rs"
path = "src/lib.rs"

[[bin]]
name = "column-rs"
path = "src/bin/column-rs/main.rs"

[dependencies]
# TODO(db-storage#5 / column-rs#5): switch to a tagged release once
# t-rust-db/db-storage#5 (folding db-parquet in, db-storage#4) merges.
db-storage = { git = "https://github.com/t-rust-db/db-storage", branch = "feat/4-column-module" }
sql-types = { git = "https://github.com/t-rust-db/db-core", tag = "v0.4.1", package = "sql-types" }
sql-expr = { git = "https://github.com/t-rust-db/db-core", tag = "v0.4.1", package = "sql-expr" }
sql-parser = { git = "https://github.com/t-rust-db/db-core", tag = "v0.4.1", package = "sql-parser" }
sql-join = { git = "https://github.com/t-rust-db/db-core", tag = "v0.4.1", package = "sql-join" }
sql-vm = { git = "https://github.com/t-rust-db/db-core", tag = "v0.4.1", package = "sql-vm", default-features = false, features = ["batch"] }
db-cli = { git = "https://github.com/t-rust-db/db-cli", tag = "v0.1.0" }
