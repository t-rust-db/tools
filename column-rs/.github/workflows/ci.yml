name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DUCKDB_VERSION: "1.5.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # `.cargo/config.toml` patches db-storage/db-core/db-cli to sibling
      # paths (`../db-core`, etc.) for local monorepo development -- that
      # patch applies unconditionally, so CI checks out column-rs and its
      # siblings all directly under $GITHUB_WORKSPACE (rather than relying
      # on the default double-nested checkout dir) so the relative paths
      # resolve the same way they do locally. db-parquet was folded into
      # db-storage's `column` module (db-storage#4) and no longer exists
      # as a separate checkout.
      - uses: actions/checkout@v4
        with:
          path: column-rs
      - uses: actions/checkout@v4
        with:
          repository: t-rust-db/db-storage
          path: db-storage
      - uses: actions/checkout@v4
        with:
          repository: t-rust-db/db-core
          path: db-core
      - uses: actions/checkout@v4
        with:
          repository: t-rust-db/db-cli
          path: db-cli

      - name: Install pinned DuckDB (oracle for tests/oracle.rs)
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o duckdb.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/duckdb
          duckdb --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        working-directory: column-rs
        run: cargo build --all-targets

      - name: Test
        working-directory: column-rs
        run: cargo test

      - name: Clippy
        working-directory: column-rs
        run: cargo clippy --all-targets -- -D warnings
