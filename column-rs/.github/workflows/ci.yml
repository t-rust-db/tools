name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DUCKDB_VERSION: "1.5.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned DuckDB (oracle for tests/oracle.rs)
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o duckdb.zip
          unzip duckdb.zip
          sudo mv duckdb /usr/local/bin/duckdb
          duckdb --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
