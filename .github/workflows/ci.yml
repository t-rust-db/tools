name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-cli:
    name: db-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make -C db-cli lint
      - run: make -C db-cli test
