# sqlite-rs weekly assurance (db-core ADR 0000 §Invariants (f)/(g)): the
# checks too slow or too noisy for every pull request, run on a schedule and
# on demand. Ported from t-rust-db/sqlite-rs#54 (tools#1).
# `sqlite-rs.yml` is the PR gate set (test, lint/supply-chain, corpus, fuzz-smoke,
# informational). This workflow adds what `make ci` deliberately leaves out:
# the instrumented coverage floor, the spec->code->test assurance dashboard,
# grammar drift against pinned parse.y, a scoped mutation run, and a longer
# libFuzzer pass per target. Each job writes a $GITHUB_STEP_SUMMARY block so
# the weekly numbers are readable without opening logs.
name: sqlite-rs assurance

on:
  schedule:
    # Mondays 06:30 UTC, after db-core's weekly run.
    - cron: "30 6 * * 1"
  workflow_dispatch:

defaults:
  run:
    working-directory: sqlite-rs

env:
  # Same pins as sqlite-rs.yml — enforced there by `make version-pin`.
  SQLITE_ORACLE_VERSION: "3.54.1"
  SQLITE_ORACLE_TARBALL: "sqlite-autoconf-3540100"
  MVL_RUST_REV: "a64eb33e7c9ef9ad031d22a70405e59aa1ad3cb0"
  # sqlite-rs keeps its own target dir inside the workspace (its Makefile).
  CARGO_TARGET_DIR: ${{ github.workspace }}/sqlite-rs/target

jobs:
  # Coverage floor (COVERAGE_MIN) over the unit suite plus the corpus
  # harness, so lines only the oracle diffs reach count. Needs the pinned
  # oracle for the corpus half — same build/verify steps as sqlite-rs.yml.
  coverage-and-assurance:
    name: Coverage floor + assurance dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: sqlite-rs-assurance-coverage
          workspaces: ". -> sqlite-rs/target"
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-llvm-cov

      - name: Cache pinned sqlite3 oracle
        id: cache-sqlite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.local/sqlite-oracle
          key: sqlite-oracle-${{ env.SQLITE_ORACLE_VERSION }}-${{ runner.os }}
      - name: Build pinned sqlite3 oracle
        if: steps.cache-sqlite.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL "https://sqlite.org/2026/${SQLITE_ORACLE_TARBALL}.tar.gz" -o sqlite.tar.gz
          tar xzf sqlite.tar.gz
          cd "${SQLITE_ORACLE_TARBALL}"
          ./configure --prefix="$HOME/.local/sqlite-oracle"
          make -j"$(nproc)"
          make install
      - name: Verify the oracle is the pinned, non-codec build
        run: |
          set -euo pipefail
          ORACLE="$HOME/.local/sqlite-oracle/bin/sqlite3"
          echo "ORACLE_SQLITE3=$ORACLE" >> "$GITHUB_ENV"
          found="$("$ORACLE" -version | awk '{print $1}')"
          if [ "$found" != "$SQLITE_ORACLE_VERSION" ]; then
            echo "error: oracle is $found, expected $SQLITE_ORACLE_VERSION"; exit 1
          fi
          if "$ORACLE" :memory: "PRAGMA compile_options;" | grep -qi codec; then
            echo "error: oracle is a codec build"; exit 1
          fi
          echo "oracle: $ORACLE ($found, non-codec)"

      - name: Coverage floor
        run: |
          set -o pipefail
          make check-coverage 2>&1 | tee coverage.log
          {
            echo "## Line coverage"
            echo
            echo '```'
            grep -E 'Line coverage|TOTAL' coverage.log || tail -5 coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assurance dashboard
        run: |
          set -o pipefail
          make check-assurance 2>&1 | tee assurance.log
          {
            echo "## Assurance (spec -> code -> test)"
            echo
            echo '```'
            tail -30 assurance.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The EBNF's parse.y annotations must still resolve against the pinned
  # upstream grammar. Cheap, but it fetches — keep it off the PR path.
  grammar-drift:
    name: Grammar drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check-grammar-drift

  # Scoped mutation run over the core modules (MUTANTS_FILE default:
  # record decode, b-tree write path, VDBE write-opcode dispatch). A
  # whole-crate run is still a V1 exit-gate deliverable (epic #5), so this
  # reports the survivor count rather than blocking on it. MUTANTS_FILE now
  # defaults to src/vdbe (record decode and the b-tree moved to db-core).
  mutants:
    name: Mutation testing (scoped)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: sqlite-rs-assurance-mutants
          workspaces: ". -> sqlite-rs/target"
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-mutants
      - name: Run scoped mutants
        continue-on-error: true
        run: make mutants
      - name: Summarize
        if: always()
        run: |
          {
            echo "## Mutants (scoped: $(grep -m1 '^MUTANTS_FILE' Makefile | cut -d'=' -f2-))"
            echo
            echo '```'
            for f in caught missed timeout unviable; do
              [ -f "target/mutants.out/$f.txt" ] && printf '%-9s %s\n' "$f" "$(wc -l < "target/mutants.out/$f.txt")"
            done
            echo '```'
            if [ -s target/mutants.out/missed.txt ]; then
              echo
              echo "<details><summary>Missed</summary>"
              echo
              echo '```'
              head -50 target/mutants.out/missed.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-out
          path: sqlite-rs/target/mutants.out
          if-no-files-found: ignore

  # Longer libFuzzer pass per target than the 15s PR smoke. A crash here is
  # a false no-panic-totality claim (spec 003 Req 6, spec 008 Req 2, spec
  # 009 / #89) — real, so this job does fail.
  fuzz-long:
    name: Fuzz (5 min per target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: sqlite-rs-assurance-fuzz
          workspaces: ". -> sqlite-rs/target"
      - name: Cache cargo-fuzz
        id: cache-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}
      - if: steps.cache-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked
      - name: Fuzz every target
        run: |
          set -o pipefail
          FUZZ_SMOKE_SECONDS=300 make fuzz-smoke 2>&1 | tee fuzz.log
          {
            echo "## Fuzz (300s per target)"
            echo
            echo '```'
            grep -E 'Done|cov:|crash|panicked|fuzz-' fuzz.log | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: sqlite-rs/tests/fuzz/artifacts
          if-no-files-found: ignore
