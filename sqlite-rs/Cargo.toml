[package]
name = "sqlite-rs"
version = "0.23.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "A binary-compatible Rust replication of SQLite"
repository = "https://github.com/t-rust-db/sqlite-rs"
documentation = "https://docs.rs/sqlite-rs"
keywords = ["sqlite", "database", "sql", "embedded"]
categories = ["database", "database-implementations"]

[dependencies]
# First-party t-rust-db crates, pinned to release tags (ADR-0040). Exactly
# the features this crate uses, nothing by default. Bumping a tag is a
# reviewed dependency update: check-deny, cargo vet, sbom, full test run.
db-storage = { version = "0.6.3", git = "https://github.com/t-rust-db/db-storage", tag = "v0.6.3", default-features = false, features = ["row"] }
# Parser (t-rust-db/sqlite-rs#17): db-core's parser::row is this crate's
# own parser, ported; a strict superset until Lab271/sqlite-rs#701/#702
# land (db-core ADR 0009). More db-core features follow with #18/#19.
db-core = { version = "0.71.1", git = "https://github.com/t-rust-db/db-core", tag = "v0.71.1", default-features = false, features = ["parser-row", "vm-row", "codegen-row"] }
# CLI-only (readline, history, REPL loop, output modes — t-rust-db/sqlite-rs#14/#15):
# optional so library consumers with `default-features = false` never pull
# it (or its libc/dirs closure) in.
db-cli = { version = "0.4.1", git = "https://github.com/t-rust-db/db-cli", tag = "v0.4.1", optional = true }

[features]
default = ["cli"]
# The `sqlite-rs` binary. Off => library only.
cli = ["dep:db-cli"]

# The CLI itself; auto-discovery would find it anyway, but the feature gate
# needs an explicit entry.
[[bin]]
name = "sqlite-rs"
path = "src/bin/sqlite-rs/main.rs"
required-features = ["cli"]

# Test-only helper: a genuine second OS process for the cross-process
# lock-contention tests (#66; now `tests/corpus/*_interop_test.rs` — the
# in-module ones moved to db-storage with `row::vfs`). Not a `#[[test]]`
# itself — spawned via `Command`/`CARGO_BIN_EXE_lock_probe`.
[[bin]]
name = "lock_probe"
path = "tests/helpers/lock_probe.rs"

# Test-only helper: a genuine second OS process for #361's crash-torture
# test (`tests/corpus/crash_torture_test.rs`) to `kill -9` mid-write-loop
# — a same-process thread can't be killed independently of the test
# process itself. Not a `[[test]]` itself — spawned via
# `Command`/`CARGO_BIN_EXE_write_loop_probe`.
[[bin]]
name = "write_loop_probe"
path = "tests/helpers/write_loop_probe.rs"

[[test]]
name = "unit_layer_isolation"
