[workspace]
members = ["db-cli", "column-rs", "column-ingest", "sqlite-rs", "loglume", "trigrep", "db-studio"]
# Standalone packages under sqlite-rs (cargo-fuzz crate, throwaway spikes).
exclude = ["sqlite-rs/tests/fuzz", "sqlite-rs/tests/spike"]
resolver = "2"

# One db-core pin for every tool (#1), always the tagged release on GitHub.
[workspace.dependencies]
db-core = { version = "0.217.3", git = "https://github.com/t-rust-db/db-core", tag = "v0.217.3", default-features = false }
db-cli = { path = "db-cli", version = "0.5.0" }

# Cargo only honours profiles at the workspace root (moved here from trigrep).
[profile.release]
lto = true
codegen-units = 1
# Keep column-rs under the parity benchmark's 5 MB binary target (#89):
# no symbol table, and no unwind tables or landing pads. Nothing catches
# a panic (a worker's is re-raised when its thread scope closes), so a
# panic still prints its message and exits, by SIGABRT. Tests unwind.
strip = true
panic = "abort"
