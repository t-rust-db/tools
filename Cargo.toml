[workspace]
members = ["db-cli", "column-rs", "sqlite-rs", "loglume", "trigrep", "db-studio"]
# Standalone packages under sqlite-rs (cargo-fuzz crate, throwaway spikes).
exclude = ["sqlite-rs/tests/fuzz", "sqlite-rs/tests/spike"]
resolver = "2"

# One db-core pin for every tool (#1). The open-ended requirement lets a local
# `[patch]` onto a newer sibling db-core checkout apply (db-core#481); the tag
# is what CI and `cargo install --git` build. See README.md.
[workspace.dependencies]
db-core = { version = ">=0.114.7", git = "https://github.com/t-rust-db/db-core", tag = "v0.114.7", default-features = false }
db-cli = { path = "db-cli", version = "0.5.0" }

# Cargo only honours profiles at the workspace root (moved here from trigrep).
[profile.release]
lto = true
codegen-units = 1
