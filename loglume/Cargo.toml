[package]
name = "loglume"
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/t-rust-db/loglume"
description = "Fast CLI log viewer with SQL filtering, built on db-core"
authors = ["Ilja Heitlager <iheitlager@schubergphilis.com>"]

[[bin]]
name = "loglume"
path = "src/bin/loglume.rs"

[lib]
name = "loglume"
path = "src/lib.rs"

[dependencies]
db-core = { version = "0.88.1", git = "https://github.com/t-rust-db/db-core", tag = "v0.88.1", default-features = false, features = ["storage-stream", "vm-stream"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"

[dev-dependencies]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
