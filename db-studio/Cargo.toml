[package]
name = "db-studio"
version = "0.6.0"
edition = "2021"
description = "A TUI database studio for the t-rust-db family -- open a .sqlite/.parquet/.log file, get a query pane and grid output over the matching db-core engine"
license = "Apache-2.0"
repository = "https://github.com/t-rust-db/db-studio"
authors = ["Ilja Heitlager <iheitlager@schubergphilis.com>"]

[dependencies]
# M1 was row-mode only (see .openspec/plan.md); M3 added batch,
# M5 (db-studio#35) adds stream. Pinned to a tagged db-core release
# (same convention as sqlite-rs/column-rs/trigrep) rather than a local
# path -- a path dependency always builds against whatever commit
# happens to be checked out on disk, which is a real hazard in a
# multi-checkout/worktree environment.
db-core = { version = "0.86.1", git = "https://github.com/t-rust-db/db-core", tag = "v0.86.1", default-features = false, features = ["engine-row", "engine-column", "engine-stream"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
tui-textarea-2 = { version = "0.13.2", default-features = false, features = ["ratatui", "crossterm"] }
catppuccin = { version = "2.8.0", features = ["ratatui"] }
tui-tree-widget = "0.24.1"
nucleo-matcher = "0.3.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
